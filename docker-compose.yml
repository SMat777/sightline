services:
  db:
    image: postgres:17
    container_name: sightline-db
    environment:
      POSTGRES_DB: sightline
      POSTGRES_USER: sightline
      POSTGRES_PASSWORD: sightline
    ports:
      - "5432:5432"
    volumes:
      - sightline-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sightline -d sightline"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sightline-pgdata:
